[platformio]
src_dir = platformio
default_envs = quaternion_yaw_pitch_roll

[env]
; Set these two values for your actual board before building.
; Example for Arduino Mega 2560 (not Uno R3):
; platform = atmelavr
; board = megaatmega2560
framework = arduino
lib_deps = adafruit/Adafruit BNO08x
monitor_speed = 115200
; Uncomment and adjust only if automatic port detection fails on Windows.
; upload_port = COM3
; monitor_port = COM3

[env:quaternion_yaw_pitch_roll]
build_flags = -DBNO085_SAMPLE=1

[env:rotation_vector]
build_flags = -DBNO085_SAMPLE=2

[env:multi_report]
build_flags = -DBNO085_SAMPLE=3
